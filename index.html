<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eko Taxi</title>
    
    <!-- Leaflet (რუკის) CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        /* რუკა იკავებს მთელ ეკრანს */
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* ქვედა პანელი (Bottom Sheet) */
        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 25px 20px;
            box-sizing: border-box;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            transform: translateY(0);
            transition: transform 0.3s ease-out;
        }

        .panel-header { text-align: center; margin-bottom: 20px; }
        .panel-header h3 { margin: 0; color: #2c3e50; font-size: 22px; }
        .panel-header p { margin: 5px 0 0 0; color: #7f8c8d; font-size: 14px; }

        /* მთავარი ღილაკი ანიმაციით */
        .action-btn {
            background-color: #f5b041;
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .action-btn:active { transform: scale(0.98); background-color: #e67e22; }
        .action-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; }

        /* GPS ძებნის სტატუსი */
        #location-status { text-align: center; font-size: 12px; color: #e74c3c; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>

    <!-- რუკის კონტეინერი -->
    <div id="map"></div>

    <!-- ინტერფეისის ქვედა პანელი -->
    <div class="bottom-panel" id="ui-panel">
        <div class="panel-header">
            <h3>სად მივდივართ?</h3>
            <p>მონიშნე ლოკაცია რუკაზე ან გამოიყენე GPS</p>
        </div>
        
        <button id="call-taxi-btn" class="action-btn" disabled>
            <span>📍 ლოკაციის ძიება...</span>
        </button>
        <div id="location-status">ჩართე GPS ლოკაციისთვის...</div>
    </div>

    <!-- Leaflet (რუკის) JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- ჩვენი ლოგიკა -->
    <script type="module" src="passenger.js"></script>
    
</body>
</html>
