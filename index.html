<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eko Taxi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- ეკრანი 1: ავტორიზაცია -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2>Eko Taxi</h2>
            <p class="auth-subtitle">გაიარეთ ავტორიზაცია</p>
            
            <input type="text" id="name-input" placeholder="თქვენი სახელი">
            <input type="tel" id="phone-input" placeholder="ტელეფონი (მაგ: 599...)" value="5">
            
            <button id="login-btn" class="action-btn">აპლიკაციაში შესვლა</button>
            <div id="error-msg" style="color: #e74c3c; font-size: 13px; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- ეკრანი 2: მთავარი რუკა -->
    <div id="app-screen" class="screen" style="display: none;">
        
        <!-- ლამაზი ზედა პანელი -->
        <div class="top-bar">
            <div class="user-info">
                <div class="avatar" id="user-avatar">?</div>
                <p class="user-name" id="display-name">მომხმარებელი</p>
            </div>
            <button id="logout-btn" class="logout-btn">გასვლა</button>
        </div>

        <!-- რუკა და ლოკაციის პინი -->
        <div id="map"></div>
        <div class="center-pin" id="center-pin"></div>
        
        <!-- ქვედა პანელი -->
        <div class="bottom-panel">
            <h3 class="panel-title">აირჩიეთ მისამართი</h3>
            <p class="panel-subtitle">გაამოძრავეთ რუკა ლოკაციის მოსანიშნად</p>
            
            <button id="call-taxi-btn" class="action-btn">🚕 ტაქსის გამოძახება</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="passenger.js"></script>
</body>
</html>
