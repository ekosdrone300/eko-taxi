<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eko Taxi</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- მარშრუტების ხაზის ბიბლიოთეკა -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* საძიებო ველი (ზემოთ) */
        .search-box {
            position: absolute;
            top: 20px;
            left: 5%;
            width: 90%;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            box-sizing: border-box;
            gap: 10px;
        }
        .search-box input { border: none; outline: none; width: 100%; font-size: 16px; }
        .search-box button { background: none; border: none; font-size: 20px; cursor: pointer; }

        /* რუკის ცენტრალური პინი */
        .center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            font-size: 40px;
            z-index: 1000;
            pointer-events: none; /* რომ რუკის მოძრაობას ხელი არ შეუშალოს */
            transition: transform 0.2s;
        }
        
        /* ანიმაცია რუკის მოძრაობისას */
        .center-pin.moving { transform: translate(-50%, -120%); }

        /* ქვედა პანელი */
        .bottom-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: white; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 25px 20px; box-sizing: border-box; z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }
        .action-btn {
            background-color: #2c3e50; color: white; border: none; padding: 18px;
            width: 100%; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="სად მიდიხართ?">
        <button id="search-btn">🔍</button>
    </div>

    <!-- ფიქსირებული პინი რუკის შუაში -->
    <div class="center-pin" id="center-pin">📍</div>

    <div id="map"></div>

    <div class="bottom-panel" id="ui-panel">
        <button id="action-btn" class="action-btn">დანიშნულების არჩევა</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script type="module" src="passenger.js"></script>
    
</body>
</html>
