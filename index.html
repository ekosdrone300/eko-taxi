<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eko Taxi</title>
    <!-- ვაკავშირებთ ჩვენს CSS-ს და რუკის დიზაინს -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- ეკრანი 1: ავტორიზაცია -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2>ავტორიზაცია</h2>
            <div id="phone-section">
                <input type="tel" id="phone-input" placeholder="+995 5XX XX XX XX" value="+995">
                <div id="recaptcha-container"></div>
                <button id="send-code-btn" class="action-btn">SMS კოდის გაგზავნა</button>
            </div>
            
            <div id="code-section" style="display: none;">
                <input type="number" id="code-input" placeholder="6-ნიშნა კოდი">
                <button id="verify-code-btn" class="action-btn">შესვლა</button>
            </div>
            <div id="error-msg" class="error-msg"></div>
        </div>
    </div>

    <!-- ეკრანი 2: მთავარი რუკა -->
    <div id="app-screen" class="screen" style="display: none;">
        <div id="map"></div>
        
        <div class="bottom-panel">
            <h3 style="margin-top:0; color:#2c3e50; text-align:center;">სად მივდივართ?</h3>
            <button id="call-taxi-btn" class="action-btn" disabled>📍 ლოკაციის ძიება...</button>
            <div id="location-status" style="text-align:center; font-size:12px; margin-top:10px;"></div>
            
            <button id="logout-btn" style="margin-top:15px; background:none; border:none; color:#e74c3c; width:100%; cursor:pointer;">ანგარიშიდან გასვლა</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="passenger.js"></script>
</body>
</html>
