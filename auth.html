<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>შესვლა - Eko Taxi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        
        .role-selector { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: white; cursor: pointer; transition: 0.2s; }
        .role-btn.active { background: #f5b041; color: white; border-color: #f5b041; font-weight: bold; }
        .role-btn:first-child { border-radius: 8px 0 0 8px; }
        .role-btn:last-child { border-radius: 0 8px 8px 0; }

        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .action-btn { background-color: #27ae60; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .action-btn:disabled { background-color: #bdc3c7; }
        
        #code-section { display: none; margin-top: 15px; }
        #recaptcha-container { margin-bottom: 15px; display: flex; justify-content: center; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>ავტორიზაცია</h2>
        
        <div class="role-selector">
            <button id="role-passenger" class="role-btn active" onclick="selectRole('passenger')">მგზავრი</button>
            <button id="role-driver" class="role-btn" onclick="selectRole('driver')">მძღოლი</button>
        </div>

        <div id="phone-section">
            <input type="tel" id="phone-input" placeholder="+995 5XX XX XX XX" value="+995">
            <div id="recaptcha-container"></div>
            <button id="send-code-btn" class="action-btn">SMS კოდის გაგზავნა</button>
        </div>

        <div id="code-section">
            <input type="number" id="code-input" placeholder="6-ნიშნა კოდი">
            <button id="verify-code-btn" class="action-btn">შესვლა</button>
        </div>

        <div id="error-msg" class="error-msg"></div>
    </div>

    <!-- Firebase და Auth ლოგიკა -->
    <script type="module" src="auth.js"></script>
    <script>
        let selectedRole = 'passenger';
        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-passenger').classList.remove('active');
            document.getElementById('role-driver').classList.remove('active');
            document.getElementById(`role-${role}`).classList.add('active');
            // ვინახავთ არჩეულ როლს ლოკალურად, რათა შესვლის მერე სწორ გვერდზე გადავამისამართოთ
            localStorage.setItem('userRole', role);
        }
        // საწყისი როლის შენახვა
        localStorage.setItem('userRole', selectedRole);
    </script>
</body>
</html>
